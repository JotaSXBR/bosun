packages:
  - "apps/*"
  - "packages/*"
  - "tooling/*"

minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.11.7"
  - "@turbo/darwin-arm64@2.11.7"
  - "@turbo/linux-64@2.11.7"
  - "@turbo/linux-arm64@2.11.7"
  - "@turbo/windows-64@2.11.7"
  - "@turbo/windows-arm64@2.11.7"
  - turbo@2.11.7
  - "@sentry/browser-utils@11.4.0"
  - "@sentry/browser@11.4.0"
  - "@sentry/bundler-plugins@11.4.0"
  - "@sentry/core@11.4.0"
  - "@sentry/feedback@11.4.0"
  - "@sentry/nextjs@11.4.0"
  - "@sentry/node@11.4.0"
  - "@sentry/opentelemetry@11.4.0"
  - "@sentry/react@11.4.0"
  - "@sentry/replay-canvas@11.4.0"
  - "@sentry/replay@11.4.0"
  - "@sentry/server-runtime-injection@11.4.0"
  - "@sentry/server-utils@11.4.0"
  - "@sentry/vercel-edge@11.4.0"
  - "@aws-sdk/client-s3@3.1146.0"
  - "@aws-sdk/s3-request-presigner@3.1146.0"
allowBuilds:
  esbuild: true
  unrs-resolver: true
  "@depot/cli": true
  lefthook: true
  # next-intl 4.x declares these for its optional SWC message extractor,
  # which we don't use — the runtime is plain JS and both ship platform
  # binaries via optionalDependencies anyway. Explicit deny (approved by
  # repo owner, i18n slice).
  "@swc/core": false
  "@parcel/watcher": false
