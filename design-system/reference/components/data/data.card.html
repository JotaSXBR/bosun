<script type="text/babel">
const NS = window.BOSUNDesignSystem_c587fa;

const { Metric, ProgressBar, RingChart, BarChart } = NS;

          <RingChart size={120} thickness={16} segments={[{ value: 70, color: 'var(--data-1)' }, { value: 30, color: 'var(--data-2)' }]} />

      </div>
      <div style={{ background: 'var(--surface-card)', borderRadius: 24, padding: 20 }}>
        <BarChart height={290} formatValue={(v) => v + ' concluídas'} data={[
          { label: 'Seg', value: 18, target: 26 }, { label: 'Ter', value: 22, target: 26 }, { label: 'Qua', value: 32, target: 34 },
