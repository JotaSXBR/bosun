<script type="text/babel">
const NS = window.BOSUNDesignSystem_c587fa;

const { Card, IconButton, Accordion, Dialog, Button, Metric, ProgressBar, Checkbox } = NS;
function App() {
  const [open, setOpen] = React.useState(false);
  return (
    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
      <div className="col" style={{ gap: 16 }}>
        <Card title="Prioridades de hoje" actions={<><IconButton icon="bell" label="Alertas" /><IconButton icon="arrow-up-right" label="Abrir" /></>}>

        </Card>
        <Card tone="accent" title="Fluxos ativos" actions={<IconButton variant="inverse" icon="arrow-up-right" label="Abrir" />}>

      </div>
      <Card title="Projetos" actions={<IconButton icon="arrow-up-right" label="Abrir" />}>
