<!-- @dsCard group="Colors" viewport="700x210" name="Surface layers (dark)" subtitle="Depth is tonal: each step closer to the user is a little lighter. No borders between layers." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:22px 24px;background:var(--bg-page);color:var(--text-body);font-family:var(--font-sans)}
.m{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}.n{font-size:13px;color:var(--text-strong);font-weight:500}
.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:72px;border-radius:16px}.row{display:flex;gap:10px}.g{display:grid;gap:10px}</style></head><body>
<div style="background:var(--bg-page);border-radius:20px;padding:16px;box-shadow:inset 0 0 0 1px var(--border-default);display:flex;gap:14px;align-items:stretch">
<div class="m" style="width:110px;align-self:flex-end">--bg-page</div>
<div style="flex:1;background:var(--surface-card);border-radius:20px;padding:14px;display:flex;gap:12px;align-items:stretch">
<div class="m" style="width:110px;align-self:flex-end">--surface-card</div>
<div style="flex:1;background:var(--surface-raised);border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center">
<div class="m" style="flex:1;align-self:flex-end">--surface-raised</div>
<div style="height:44px;padding:0 16px;border-radius:999px;background:var(--surface-control);box-shadow:var(--shadow-control);border:1px solid var(--border-subtle);display:flex;align-items:center" class="m">--surface-control</div>
<div style="height:44px;padding:0 16px;border-radius:999px;background:var(--surface-accent);display:flex;align-items:center;color:var(--text-on-accent);font:500 11px var(--font-mono)">--surface-accent</div>
</div></div></div>
<div class="row" style="margin-top:12px;gap:22px"><span style="color:var(--text-strong);font-size:13px">--text-strong</span><span style="color:var(--text-body);font-size:13px">--text-body</span><span style="color:var(--text-muted);font-size:13px">--text-muted</span><span style="color:var(--text-subtle);font-size:13px">--text-subtle</span><span style="color:var(--text-accent);font-size:13px">--text-accent</span></div>
</body></html>
