<!-- @dsCard group="Colors" viewport="700x150" name="Status colors" subtitle="Soft tint + full-strength ink. Âmbar is the only warning color; running reuses Verde sinal." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:22px 24px;background:var(--bg-page);color:var(--text-body);font-family:var(--font-sans)}
.m{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}.n{font-size:13px;color:var(--text-strong);font-weight:500}
.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:72px;border-radius:16px}.row{display:flex;gap:10px}.g{display:grid;gap:10px}</style></head><body>
<div class="row"><div class="sw" style="flex:1"><div style="height:64px;border-radius:16px;background:var(--status-success-bg);display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--status-success);font-weight:500;font-size:13px"><span style="width:8px;height:8px;border-radius:50%;background:var(--status-success)"></span>Concluído</div><div class="m">--status-success<br>--status-success-bg</div></div><div class="sw" style="flex:1"><div style="height:64px;border-radius:16px;background:var(--status-warning-bg);display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--status-warning);font-weight:500;font-size:13px"><span style="width:8px;height:8px;border-radius:50%;background:var(--status-warning)"></span>Atenção</div><div class="m">--status-warning<br>--status-warning-bg</div></div><div class="sw" style="flex:1"><div style="height:64px;border-radius:16px;background:var(--status-danger-bg);display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--status-danger);font-weight:500;font-size:13px"><span style="width:8px;height:8px;border-radius:50%;background:var(--status-danger)"></span>Falhou</div><div class="m">--status-danger<br>--status-danger-bg</div></div><div class="sw" style="flex:1"><div style="height:64px;border-radius:16px;background:var(--status-info-bg);display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--status-info);font-weight:500;font-size:13px"><span style="width:8px;height:8px;border-radius:50%;background:var(--status-info)"></span>Informação</div><div class="m">--status-info<br>--status-info-bg</div></div><div class="sw" style="flex:1"><div style="height:64px;border-radius:16px;background:var(--status-running-bg);display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--status-running);font-weight:500;font-size:13px"><span style="width:8px;height:8px;border-radius:50%;background:var(--status-running)"></span>Em execução</div><div class="m">--status-running<br>--status-running-bg</div></div></div>
</body></html>
