<!-- @dsCard group="Spacing" viewport="700x150" name="Motion" subtitle="Calm and precise: short eased transitions, no bounce, no overshoot. Charts grow in 640ms." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:22px 24px;background:var(--bg-page);color:var(--text-body);font-family:var(--font-sans)}
.m{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}.n{font-size:13px;color:var(--text-strong);font-weight:500}
.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:72px;border-radius:16px}.row{display:flex;gap:10px}.g{display:grid;gap:10px}</style></head><body>
<style>@keyframes slide{0%,15%{transform:translateX(0)}55%,100%{transform:translateX(420px)}}</style><div style="display:flex;flex-direction:column;gap:12px"><div style="display:flex;align-items:center;gap:16px"><span class="m" style="width:170px">--ease-standard · 220ms</span><div style="flex:1;height:24px;border-radius:999px;background:var(--surface-card);position:relative"><span style="position:absolute;left:4px;top:4px;width:16px;height:16px;border-radius:50%;background:var(--signal-400);animation:slide 2.4s cubic-bezier(.2,.7,.2,1) infinite alternate"></span></div></div><div style="display:flex;align-items:center;gap:16px"><span class="m" style="width:170px">--ease-enter · 360ms</span><div style="flex:1;height:24px;border-radius:999px;background:var(--surface-card);position:relative"><span style="position:absolute;left:4px;top:4px;width:16px;height:16px;border-radius:50%;background:var(--signal-400);animation:slide 2.4s cubic-bezier(0,0,.2,1) infinite alternate"></span></div></div><div style="display:flex;align-items:center;gap:16px"><span class="m" style="width:170px">--ease-exit · 140ms</span><div style="flex:1;height:24px;border-radius:999px;background:var(--surface-card);position:relative"><span style="position:absolute;left:4px;top:4px;width:16px;height:16px;border-radius:50%;background:var(--signal-400);animation:slide 2.4s cubic-bezier(.4,0,1,1) infinite alternate"></span></div></div></div>
</body></html>
