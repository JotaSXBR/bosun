<!-- @dsCard group="Brand" viewport="700x180" name="Patterns" subtitle="Hatch = planned / remaining. Dots = current / in motion. Grid = precision backdrop. Classes: .bx-hatch .bx-dots .bx-grid" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:22px 24px;background:var(--bg-page);color:var(--text-body);font-family:var(--font-sans)}
.m{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}.n{font-size:13px;color:var(--text-strong);font-weight:500}
.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:72px;border-radius:16px}.row{display:flex;gap:10px}.g{display:grid;gap:10px}</style></head><body>
<div class="row" style="gap:12px">
<div class="sw" style="flex:1"><div class="bx-hatch" style="height:120px;border-radius:20px;background-color:var(--surface-card)"></div><div class="m">.bx-hatch</div></div>
<div class="sw" style="flex:1"><div class="bx-dots" style="height:120px;border-radius:20px;background-color:var(--surface-card)"></div><div class="m">.bx-dots</div></div>
<div class="sw" style="flex:1"><div class="bx-dots bx-on-accent" style="height:120px;border-radius:20px;background-color:var(--signal-400)"></div><div class="m">.bx-dots.bx-on-accent</div></div>
<div class="sw" style="flex:1"><div class="bx-grid" style="height:120px;border-radius:20px;background-color:var(--bg-sunken)"></div><div class="m">.bx-grid</div></div></div>
</body></html>
