<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:22px 24px;background:var(--bg-page);color:var(--text-body);font-family:var(--font-sans)}

.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:72px;border-radius:16px}.row{display:flex;gap:10px}.g{display:grid;gap:10px}</style></head><body>
<div style="display:flex;gap:28px;align-items:center"><div style="width:380px"><div style="display:flex"><div style="flex:1;position:relative;background:var(--surface-card);border-radius:24px 24px 0 0;padding:20px 24px 0;outline:1px dashed rgba(45,212,191,.0)"><div style="font:500 18px var(--font-display);color:var(--text-strong)">Prioridades de hoje</div><span style="position:absolute;right:-16px;bottom:0;width:16px;height:16px;background:radial-gradient(circle at 100% 0,transparent 15.5px,var(--surface-card) 16px)"></span></div><div style="display:flex;gap:8px;padding:0 0 8px 8px"><span style="width:44px;height:44px;border-radius:50%;background:var(--surface-control);border:1px solid var(--signal-400);box-sizing:border-box"></span><span style="width:44px;height:44px;border-radius:50%;background:var(--surface-control);border:1px solid var(--signal-400);box-sizing:border-box"></span></div></div><div style="background:var(--surface-card);border-radius:0 24px 24px 24px;padding:12px 24px 24px;height:96px;box-sizing:border-box"><div style="font:300 48px/1 var(--font-display);color:var(--text-strong);letter-spacing:-.035em">12</div></div></div>
<div style="display:flex;flex-direction:column;gap:10px;font-size:13px;color:var(--text-body)"><div><span style="color:var(--text-accent);font:500 11px var(--font-mono);display:inline-block;width:56px">Tab</span>title area, radius 24 / 24 / 0 / 0</div><div><span style="color:var(--text-accent);font:500 11px var(--font-mono);display:inline-block;width:56px">Cut</span>actions (IconButton 44), gap 8 from edges</div><div><span style="color:var(--text-accent);font:500 11px var(--font-mono);display:inline-block;width:56px">Fillet</span>16px concave, radial-gradient mask</div><div><span style="color:var(--text-accent);font:500 11px var(--font-mono);display:inline-block;width:56px">Body</span>radius 0 / 24 / 24 / 24, pad 24</div><div><span style="color:var(--text-accent);font:500 11px var(--font-mono);display:inline-block;width:56px">Rule</span>1 accent card per row, max</div></div></div>
</body></html>
