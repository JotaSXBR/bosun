<!-- @dsCard group="Colors" viewport="700x130" name="Névoa & Aço" subtitle="Neutrals. Mist = light page & dark-theme ink; steel-400 = muted text on dark; steel-500 (brand) = icons/meta only." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:22px 24px;background:var(--bg-page);color:var(--text-body);font-family:var(--font-sans)}
.m{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}.n{font-size:13px;color:var(--text-strong);font-weight:500}
.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:72px;border-radius:16px}.row{display:flex;gap:10px}.g{display:grid;gap:10px}</style></head><body>
<div class="row" style="gap:6px"><div class="sw" style="flex:1"><div class="chip" style="height:64px;border-radius:12px;background:var(--white);box-shadow:inset 0 0 0 1px var(--border-subtle)"></div><div class="m" style="font-size:10px">white<br>#FFFFFF</div></div><div class="sw" style="flex:1"><div class="chip" style="height:64px;border-radius:12px;background:var(--mist);box-shadow:inset 0 0 0 1px var(--border-subtle)"></div><div class="m" style="font-size:10px">mist<br>#F4F7FA</div></div><div class="sw" style="flex:1"><div class="chip" style="height:64px;border-radius:12px;background:var(--steel-100);box-shadow:inset 0 0 0 1px var(--border-subtle)"></div><div class="m" style="font-size:10px">steel-100<br>#E6ECF2</div></div><div class="sw" style="flex:1"><div class="chip" style="height:64px;border-radius:12px;background:var(--steel-200);box-shadow:inset 0 0 0 1px var(--border-subtle)"></div><div class="m" style="font-size:10px">steel-200<br>#CFD8E3</div></div><div class="sw" style="flex:1"><div class="chip" style="height:64px;border-radius:12px;background:var(--steel-300);box-shadow:inset 0 0 0 1px var(--border-subtle)"></div><div class="m" style="font-size:10px">steel-300<br>#A9B6C6</div></div><div class="sw" style="flex:1"><div class="chip" style="height:64px;border-radius:12px;background:var(--steel-400);box-shadow:inset 0 0 0 1px var(--border-subtle)"></div><div class="m" style="font-size:10px">steel-400<br>#8594A8</div></div><div class="sw" style="flex:1"><div class="chip" style="height:64px;border-radius:12px;background:var(--steel-500);box-shadow:inset 0 0 0 1px var(--border-subtle)"></div><div class="m" style="font-size:10px">steel-500<br>#64748B</div></div><div class="sw" style="flex:1"><div class="chip" style="height:64px;border-radius:12px;background:var(--steel-600);box-shadow:inset 0 0 0 1px var(--border-subtle)"></div><div class="m" style="font-size:10px">steel-600<br>#4B5A70</div></div><div class="sw" style="flex:1"><div class="chip" style="height:64px;border-radius:12px;background:var(--steel-700);box-shadow:inset 0 0 0 1px var(--border-subtle)"></div><div class="m" style="font-size:10px">steel-700<br>#364357</div></div></div>
</body></html>
