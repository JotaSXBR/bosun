<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:22px 24px;background:var(--bg-page);color:var(--text-body);font-family:var(--font-sans)}
.m{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}.n{font-size:13px;color:var(--text-strong);font-weight:500}
.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:72px;border-radius:16px}.row{display:flex;gap:10px}.g{display:grid;gap:10px}</style></head><body>
<div class="row" style="gap:14px;align-items:flex-end"><div class="sw" style="flex:1"><div style="height:72px;background:var(--surface-raised);border-radius:6px;box-shadow:inset 0 0 0 1px var(--border-default)"></div><div class="m">xs · 6</div></div><div class="sw" style="flex:1"><div style="height:72px;background:var(--surface-raised);border-radius:10px;box-shadow:inset 0 0 0 1px var(--border-default)"></div><div class="m">sm · 10</div></div><div class="sw" style="flex:1"><div style="height:72px;background:var(--surface-raised);border-radius:14px;box-shadow:inset 0 0 0 1px var(--border-default)"></div><div class="m">md · 14</div></div><div class="sw" style="flex:1"><div style="height:72px;background:var(--surface-raised);border-radius:18px;box-shadow:inset 0 0 0 1px var(--border-default)"></div><div class="m">lg · 18</div></div><div class="sw" style="flex:1"><div style="height:72px;background:var(--surface-raised);border-radius:24px;box-shadow:inset 0 0 0 1px var(--border-default)"></div><div class="m">xl · card · 24</div></div><div class="sw" style="flex:1"><div style="height:72px;background:var(--surface-raised);border-radius:32px;box-shadow:inset 0 0 0 1px var(--border-default)"></div><div class="m">2xl · 32</div></div><div class="sw" style="flex:1"><div style="height:72px;background:var(--surface-raised);border-radius:999px;box-shadow:inset 0 0 0 1px var(--border-default)"></div><div class="m">pill · 999</div></div></div>
</body></html>
