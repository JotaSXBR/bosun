<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:22px 24px;background:var(--bg-page);color:var(--text-body);font-family:var(--font-sans)}
.m{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}.n{font-size:13px;color:var(--text-strong);font-weight:500}
.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:72px;border-radius:16px}.row{display:flex;gap:10px}.g{display:grid;gap:10px}</style></head><body>
<div class="row"><div class="sw" style="flex:1"><div style="height:56px;border-radius:999px;background:var(--data-1)"></div><div class="m">--data-1</div></div><div class="sw" style="flex:1"><div style="height:56px;border-radius:999px;background:var(--data-2)"></div><div class="m">--data-2</div></div><div class="sw" style="flex:1"><div style="height:56px;border-radius:999px;background:var(--data-3)"></div><div class="m">--data-3</div></div><div class="sw" style="flex:1"><div style="height:56px;border-radius:999px;background:var(--data-4)"></div><div class="m">--data-4</div></div><div class="sw" style="flex:1"><div style="height:56px;border-radius:999px;background:var(--data-5)"></div><div class="m">--data-5</div></div><div class="sw" style="flex:1"><div class="bx-hatch" style="height:56px;border-radius:999px;background-color:var(--data-track)"></div><div class="m">--data-track + hatch</div></div></div>
</body></html>
