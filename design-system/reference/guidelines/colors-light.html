<!-- @dsCard group="Colors" viewport="700x200" name="Light theme" subtitle="[data-theme=light] — Branco névoa page, white cards, Azul abissal ink. Same components, no overrides." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:22px 24px;background:var(--bg-page);color:var(--text-body);font-family:var(--font-sans)}
.m{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}.n{font-size:13px;color:var(--text-strong);font-weight:500}
.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:72px;border-radius:16px}.row{display:flex;gap:10px}.g{display:grid;gap:10px}</style></head><body>
<div data-theme="light" style="background:var(--bg-page);color:var(--text-body);border-radius:20px;padding:16px;display:flex;gap:14px">
<div style="flex:1;background:var(--surface-card);border-radius:20px;padding:18px;box-shadow:var(--shadow-card)"><div style="font:500 17px var(--font-display);color:var(--text-strong)">Prioridades de hoje</div><div style="font:300 44px/1.1 var(--font-display);color:var(--text-strong);letter-spacing:-.03em;margin-top:6px">12</div><div style="font-size:13px;color:var(--text-muted)">tarefas · 4 concluídas</div></div>
<div style="flex:1;background:var(--surface-accent);border-radius:20px;padding:18px;color:var(--text-on-accent)"><div style="font:500 17px var(--font-display)">Fluxos ativos</div><div style="font:300 44px/1.1 var(--font-display);letter-spacing:-.03em;margin-top:6px">24</div><div style="font-size:13px;color:var(--text-on-accent-muted)">executando agora</div></div>
<div style="flex:1;display:flex;flex-direction:column;gap:8px;justify-content:center"><span style="height:40px;border-radius:999px;background:var(--surface-control);display:flex;align-items:center;padding:0 16px;font-size:13px;color:var(--text-strong);box-shadow:var(--shadow-control)">Secundário</span><span style="height:40px;border-radius:999px;background:var(--surface-inverse);display:flex;align-items:center;padding:0 16px;font-size:13px;color:var(--text-inverse)">Inverso</span><span style="font-size:13px;color:var(--text-accent)">Link · --text-accent</span></div></div>
</body></html>
