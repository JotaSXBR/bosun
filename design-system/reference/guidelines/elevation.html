<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:22px 24px;background:var(--bg-page);color:var(--text-body);font-family:var(--font-sans)}
.m{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}.n{font-size:13px;color:var(--text-strong);font-weight:500}
.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:72px;border-radius:16px}.row{display:flex;gap:10px}.g{display:grid;gap:10px}</style></head><body>
<div class="row" style="gap:18px;padding:8px 0"><div class="sw" style="flex:1"><div style="height:80px;border-radius:18px;background:var(--surface-card);box-shadow:var(--shadow-card)"></div><div class="m">--shadow-card</div></div><div class="sw" style="flex:1"><div style="height:80px;border-radius:18px;background:var(--surface-control);box-shadow:var(--shadow-control)"></div><div class="m">--shadow-control</div></div><div class="sw" style="flex:1"><div style="height:80px;border-radius:18px;background:var(--surface-raised);box-shadow:var(--shadow-raised)"></div><div class="m">--shadow-raised</div></div><div class="sw" style="flex:1"><div style="height:80px;border-radius:18px;background:var(--surface-raised);box-shadow:var(--shadow-pop)"></div><div class="m">--shadow-pop</div></div><div class="sw" style="flex:1"><div style="height:80px;border-radius:18px;background:var(--surface-accent);box-shadow:var(--shadow-glow)"></div><div class="m">--shadow-glow</div></div></div>
</body></html>
