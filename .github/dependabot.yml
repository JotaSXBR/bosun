version: 2
# Actions minutes are scarce (Free tier): one grouped PR per ecosystem,
# monthly. Grouped PRs re-run CI once for the whole batch.
updates:
  # JS deps — pnpm workspace is walked from the root manifest.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      dependencies:
        patterns: ["*"]
    ignore:
      # typescript-eslint requires typescript <6.1 — revisit when TS 7 lands upstream
      - dependency-name: "typescript"
        versions: ["7.x"]
      # eslint-plugin-react/jsx-a11y/import peers cap at eslint ^9 (plugin crashes
      # on the ESLint 10 rule-context API) — revisit on eslint-10-compatible releases
      - dependency-name: "eslint"
        versions: ["10.x"]

  # GitHub Actions versions.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions:
        patterns: ["*"]

  # Dockerfile base image pins.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      docker:
        patterns: ["*"]
