version: 2
# Actions minutes are scarce (Free tier): one grouped PR per ecosystem,
# monthly. Grouped PRs re-run CI once for the whole batch.
updates:
  # JS deps — pnpm workspace is walked from the root manifest.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      dependencies:
        patterns: ["*"]

  # GitHub Actions versions.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions:
        patterns: ["*"]

  # Dockerfile base image pins.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      docker:
        patterns: ["*"]
